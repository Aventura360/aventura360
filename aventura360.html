<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aventura360 — Planificador de Viajes</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080c18; --s1: #0f1524; --s2: #161e30; --s3: #1d2640;
  --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.14);
  --text: #e8edf8; --text2: #7a88a8; --text3: #3d4d68;
  --blue: #4f8ef7; --purple: #7c5cfa; --green: #10d48e;
  --r: 12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);font-size:14px}

/* ── BARRA SUPERIOR CORREGIDA ── */
.topbar {
  height: 76px;
  background: var(--s1);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between; /* Esto separa Logo, Menú y Botones */
  padding: 0 24px;
  position: sticky;
  top: 0;
  z-index: 100;
  gap: 20px;
}

.logo-wrapper {
  display: flex;
  align-items: center;
  flex-shrink: 0;
}

/* ── MENÚ DENTRO DE LA BARRA ── */
.nav-tabs {
  display: flex;
  gap: 4px;
  background: var(--s2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 4px;
  margin-bottom: 0; /* Eliminado el margen que lo bajaba */
  flex: 0 1 auto;   /* Permite que el menú se ajuste */
}

.nav-tab {
  padding: 8px 16px;
  border-radius: 8px;
  border: none;
  background: transparent;
  color: var(--text2);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s;
}

.nav-tab.active {
  background: var(--blue);
  color: #fff;
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: var(--r);
  border: none;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
}
.btn-primary { background: var(--blue); color: #fff; }
.btn-ghost { background: var(--s2); color: var(--text); border: 1px solid var(--border); }

.container { max-width: 1400px; margin: 0 auto; padding: 20px; }

/* Ajuste para pantallas pequeñas */
@media(max-width: 850px) {
  .topbar { height: auto; flex-direction: column; padding: 15px; gap: 10px; }
  .nav-tabs { width: 100%; justify-content: center; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo-wrapper">
    <div class="txt-aventura" style="font-size:20px; font-weight:900; background:linear-gradient(90deg,#4f8ef7,#7c5cfa); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">AVENTURA<span style="background:linear-gradient(90deg,#7c5cfa,#a78bfa); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">360</span></div>
  </div>

  <nav class="nav-tabs">
    <button class="nav-tab active">Resumen</button>
    <button class="nav-tab">Itinerario</button>
    <button class="nav-tab">Gastos</button>
    <button class="nav-tab">Mapa</button>
  </nav>

  <div class="topbar-right">
    <button class="btn btn-ghost">Compartir</button>
    <button class="btn btn-primary">+ Nuevo Viaje</button>
  </div>
</div>

<div class="container">
  <p style="color:var(--text2); text-align:center; margin-top:40px;">Contenido del planificador...</p>
</div>

</body>
</html>
