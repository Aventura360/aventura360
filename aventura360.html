<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aventura360 — Planificador de Viajes</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #080c18;
  --s1:       #0f1524;
  --s2:       #161e30;
  --s3:       #1d2640;
  --border:   rgba(255,255,255,0.08);
  --border2:  rgba(255,255,255,0.14);
  --text:     #e8edf8;
  --text2:    #7a88a8;
  --text3:    #3d4d68;
  --blue:     #4f8ef7;
  --purple:   #7c5cfa;
  --green:    #10d48e;
  --yellow:   #f0b429;
  --red:      #f45b7a;
  --sky:      #38bdf8;
  --orange:   #fb923c;
  --r:        12px;
  --r2:       20px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow-x:hidden}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}

/* ── TOPBAR ACTUALIZADA ── */
.topbar {
  height: 76px;
  background: var(--s1);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between; /* Empuja el menú a la derecha */
  padding: 0 24px;
  position: sticky;
  top: 0;
  z-index: 100;
}

.logo-wrapper {
  display: flex;
  align-items: center;
  gap: 12px;
}

/* ── NAV TABS EN EL TOPBAR ── */
.nav-tabs {
  display: flex;
  gap: 4px;
  background: var(--s2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 4px;
  margin-bottom: 0; /* Eliminado el margen inferior */
}

.nav-tab {
  padding: 8px 16px;
  border-radius: 8px;
  border: none;
  background: transparent;
  color: var(--text2);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s;
  font-family:'Inter',sans-serif;
}

.nav-tab.active {
  background: var(--blue);
  color: #fff;
}

.topbar-right-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}

/* ── RESTO DE ESTILOS MANTENIDOS ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--r);border:none;cursor:pointer;font-size:13px;font-weight:500;transition:all .15s}
.btn-primary{background:var(--blue);color:#fff}
.btn-ghost{background:var(--s2);color:var(--text);border:1px solid var(--border)}
.container{max-width:1400px;margin:0 auto;padding:20px}

/* Ajuste móvil */
@media(max-width: 900px) {
  .topbar {
    height: auto;
    flex-direction: column;
    padding: 12px;
    gap: 12px;
  }
  .nav-tabs {
    width: 100%;
    overflow-x: auto;
  }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo-wrapper">
    <div class="txt-aventura" style="font-size:20px; font-weight:900; background:linear-gradient(90deg,#4f8ef7,#7c5cfa); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">AVENTURA<span style="background:linear-gradient(90deg,#7c5cfa,#a78bfa); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">360</span></div>
  </div>

  <nav class="nav-tabs">
    <button class="nav-tab active" onclick="switchView('resumen')">Resumen</button>
    <button class="nav-tab" onclick="switchView('itinerario')">Itinerario</button>
    <button class="nav-tab" onclick="switchView('gastos')">Gastos</button>
    <button class="nav-tab" onclick="switchView('mapa')">Mapa</button>
  </nav>

  <div class="topbar-right-actions">
    <button class="btn btn-ghost">Compartir</button>
    <button class="btn btn-primary">+ Nuevo</button>
  </div>
</div>

<div class="container">
  </div>

<script>
  function switchView(viewId) {
    document.querySelectorAll('.nav-tab').forEach(tab => tab.classList.remove('active'));
    event.target.classList.add('active');
    console.log("Cambiando a vista: " + viewId);
    // Aquí iría tu lógica de App.switchView
  }
</script>

</body>
</html>
